name: ride-platform

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ride}
      POSTGRES_DB: ${POSTGRES_DB:-ride}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgis/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ride} -d ${POSTGRES_DB:-ride}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - ride-net

  redis:
    image: redis:7-alpine
    container_name: ride-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ride-net

  minio:
    image: minio/minio:latest
    container_name: ride-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ride}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ride12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ride-net

  minio-init:
    image: minio/mc:latest
    container_name: ride-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-ride} ${S3_SECRET_KEY:-ride12345}; do echo 'aguardando minio...'; sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-ride-documents};
      mc mb --ignore-existing local/${S3_BUCKET_PUBLIC:-ride-public};
      mc anonymous set download local/${S3_BUCKET_PUBLIC:-ride-public};
      echo 'buckets prontos';
      "
    networks:
      - ride-net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ride-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ride-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ride-net:
    driver: bridge
