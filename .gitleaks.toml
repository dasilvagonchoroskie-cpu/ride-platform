title = "Fortaleza Move - gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conferidos em 26/11/2026: nao sao segredos reais. Nenhum arquivo inteiro fica de fora; os casos conferidos por arquivo estao no .gitleaksignore."
regexes = [
