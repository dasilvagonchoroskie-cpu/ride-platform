  '''RSA_ECB_OAEPwithSHA_256andMGF1Padding''',      # nome de algoritmo no CofreNativo.java (3 apps)
  '''sb_publishable_[A-Za-z0-9_-]+''',              # chave publicavel do Supabase (feita para ser publica; usada no workflow de ping)
]
