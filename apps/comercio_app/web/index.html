<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- "/" no site; a esteira troca se publicar numa subpasta. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comércio da plataforma Fortaleza Move: peça e acompanhe as entregas da sua loja">
  <meta name="theme-color" content="#07122B">
  <meta name="robots" content="noindex, nofollow">
  <!-- iPhone / iPad: tela inicial -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FM Comércio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Abrir mais rapido (11/11/2026): o navegador ja conecta no servidor, nas
       imagens do mapa (TomTom) e no motor do Flutter enquanto baixa o resto. -->
  <link rel="preconnect" href="https://api.fortalezadigitalsecurity.com.br" crossorigin>
  <link rel="preconnect" href="https://api.tomtom.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.tomtom.com"> <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
  <!-- Seguranca: so carrega do proprio site, do servidor da plataforma, das imagens do mapa (TomTom) e do motor do Flutter (gstatic). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tomtom.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; connect-src 'self' https://api.fortalezadigitalsecurity.com.br https://*.tomtom.com https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fortaleza Move Comércio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07122B; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #fff; font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #carregando img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="carregando"><img src="icons/Icon-192.png" alt=""><div>Abrindo o Comércio…</div></div>
  <script src="fm-inicio.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
