<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- "/" no site; a esteira troca se publicar numa subpasta. -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comércio da plataforma Fortaleza Move: peça e acompanhe as entregas da sua loja">
  <meta name="theme-color" content="#07122B">
  <meta name="robots" content="noindex, nofollow">
  <!-- iPhone / iPad: tela inicial -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FM Comércio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Abrir mais rapido (11/11/2026): o navegador ja conecta no servidor, nas
       imagens do mapa (TomTom) e no motor do Flutter enquanto baixa o resto. -->
  <link rel="preconnect" href="https://fortaleza-mov-backend.onrender.com" crossorigin>
  <link rel="preconnect" href="https://api.tomtom.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.tomtom.com">
  <!-- Seguranca: so carrega do proprio site, do servidor da plataforma, das imagens do mapa (TomTom) e do motor do Flutter (gstatic). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tomtom.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; connect-src 'self' https://fortaleza-mov-backend.onrender.com https://*.tomtom.com https://www.gstatic.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fortaleza Move Comércio</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07122B; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: #fff; font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #carregando img { width: 96px; height: 96px; border-radius: 22px; }
    /* Botao "Instalar" (Chrome/Edge no computador e no Android). */
    #instalar { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: none; border: 0; border-radius: 24px;
      padding: 12px 18px; background: #E9B53D; color: #07122B; font: 700 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer; }
    #instalar span { margin-left: 8px; font-weight: 400; opacity: .7; }
  </style>
</head>
<body>
  <div id="carregando"><img src="icons/Icon-192.png" alt=""><div>Abrindo o Comércio…</div></div>
  <button id="instalar" type="button" title="Instala o Comércio como aplicativo neste aparelho">
    Instalar o Comércio<span id="fechar-instalar" title="Agora não">✕</span>
  </button>
  <script>
    // Alarme "o motorista chegou" no navegador (so com o site aberto): bipes + vibracao.
    (function () {
      var ctx = null;
      function audio() {
        try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (_) {}
        return ctx;
      }
      // O navegador so libera som depois de um toque: o primeiro toque no site prepara o audio.
      window.addEventListener('pointerdown', audio, { once: true });
      window.addEventListener('keydown', audio, { once: true });
      window.fmAlarme = function () {
        try { if (navigator.vibrate) navigator.vibrate([600, 300, 600, 300, 600]); } catch (_) {}
        var c = audio();
        if (!c) return;
        var t0 = c.currentTime;
        for (var i = 0; i < 6; i++) {
          var o = c.createOscillator(), g = c.createGain();
          o.type = 'square'; o.frequency.value = i % 2 ? 880 : 1175;
          g.gain.setValueAtTime(0.0001, t0 + i * 0.45);
          g.gain.exponentialRampToValueAtTime(0.35, t0 + i * 0.45 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.45 + 0.4);
          o.connect(g); g.connect(c.destination);
          o.start(t0 + i * 0.45); o.stop(t0 + i * 0.45 + 0.42);
        }
      };
    })();
  </script>
  <script>
    // Instalar como aplicativo (ícone na área de trabalho / tela inicial).
    (function () {
      var pedido = null;
      var botao = document.getElementById('instalar');
      var fechar = document.getElementById('fechar-instalar');
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        pedido = e;
        try { if (localStorage.getItem('fm.instalar.depois') === '1') return; } catch (_) {}
        botao.style.display = 'block';
      });
      botao.addEventListener('click', function (e) {
        if (e.target === fechar) {
          botao.style.display = 'none';
          try { localStorage.setItem('fm.instalar.depois', '1'); } catch (_) {}
          return;
        }
        if (!pedido) return;
        pedido.prompt();
        pedido.userChoice.finally(function () { pedido = null; botao.style.display = 'none'; });
      });
      window.addEventListener('appinstalled', function () { botao.style.display = 'none'; });
      // Some a tela de "abrindo" quando o Flutter desenha.
      window.addEventListener('flutter-first-frame', function () {
        var c = document.getElementById('carregando');
        if (c) c.remove();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
