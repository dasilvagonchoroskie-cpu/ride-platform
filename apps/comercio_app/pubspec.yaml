name: comercio_app
description: "Fortaleza Move Comercio: lojas pedem a coleta e a entrega das proprias encomendas"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  # Mapa do acompanhamento (mesmas versoes dos outros apps; imagens vem do servidor, sem chave no app).
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.3.3
  # Login e renovacao ficam no cofre do celular (mesma versao dos outros apps).
  flutter_secure_storage: 10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
