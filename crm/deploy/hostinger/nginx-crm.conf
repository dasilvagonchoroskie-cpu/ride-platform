# CRM Fortaleza Move — Nginx na VPS (modelo). Trocar CRM_DOMINIO pelo domínio definitivo (ex.: crm.seudominio.com.br)
# e salvar em /etc/nginx/sites-available/fortaleza-crm. O HTTPS é emitido pelo Certbot (passo 4 do guia).
# O CRM escuta só em 127.0.0.1:3000; quem fala com a internet é o Nginx.

limit_req_zone $binary_remote_addr zone=crm_geral:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=crm_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name CRM_DOMINIO;
    # Certbot usa esta pasta para validar o domínio; o resto vai para HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CRM_DOMINIO;

    # Preenchido pelo Certbot:
    # ssl_certificate /etc/letsencrypt/live/CRM_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/CRM_DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # O próprio CRM já manda CSP, X-Frame-Options, nosniff e no-store em /api; aqui só HSTS e o que é do servidor.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Documentos até 10 MB (+ folga do envio).
    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 60s;

    # Login, recuperação de senha e configuração inicial: limite por IP (o CRM também limita por conta, sem trancar).
    location ~ ^/api/auth/(login|recover|setup) {
        limit_req zone=crm_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        limit_req zone=crm_geral burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Substitui (não acrescenta) o cabeçalho: o CRM confia só no Nginx local (TRUST_PROXY=loopback).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
