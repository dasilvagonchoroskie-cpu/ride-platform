name: Publicar o servidor

# A cada envio que mexe no servidor, publica no Render. Ninguem precisa
# lembrar de atualizar o servidor (pedido do Evandro em 08/10/2026). Precisa
# do segredo RENDER_DEPLOY_HOOK.
#
# Requisicao de continuidade (11/11/2026):
# - So o que entra na imagem do servidor dispara (os mesmos caminhos do
#   Build Filter do Render): mudanca so do CRM, dos apps, dos documentos ou
#   dos relatorios NAO reinicia o servidor do Fortaleza Move.
# - O teste de ponta a ponta nao roda mais logo depois de publicar (podia
#   cair no horario de operacao): roda de madrugada (teste-ponta-a-ponta.yml).
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch: {}

concurrency:
  group: publicar-servidor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publicar no Render e esperar ficar no ar
        id: publicar
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set +e
          bash scripts/servidor-em-dia.sh
          r=$?
          if [ $r -eq 2 ]; then
            echo "::warning::Sem o segredo RENDER_DEPLOY_HOOK: o servidor nao foi publicado automaticamente."
            echo "publicado=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publicado=sim" >> "$GITHUB_OUTPUT"
          exit $r
