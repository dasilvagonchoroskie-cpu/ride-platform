name: Comercio na web

# Comercio pelo navegador (13/11/2026): monta a versao web do aplicativo do
# Comercio (computador e celular) e publica no ramo "comercio-web-site", que o
# Render (site estatico gratis) serve. Instala como aplicativo (PWA).
# Em qualquer ramo so MONTA (para conferir que compila); publicar so no main.
on:
  push:
    branches: [main, comercio-ajustes-alfinete-moto]
    paths:
      - 'apps/comercio_app/**'
      - '.github/workflows/comercio-web.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comercio-web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Montar o Comercio para a web
        working-directory: apps/comercio_app
        run: |
          flutter pub get
          flutter build web --release --base-href / \
            --dart-define=API_URL=https://fortaleza-mov-backend.onrender.com \
            --dart-define=APP_VERSION=1.0.${{ github.run_number }}
          echo "web-${{ github.run_number }} ($(date -u '+%d/%m/%Y %H:%M UTC'), commit ${GITHUB_SHA::7})" > build/web/versao.txt
          du -sh build/web
      - name: Conferir que o site abre no navegador (computador e celular)
        run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1
          npx -y playwright@1.48.2 install --with-deps chromium >/dev/null 2>&1
          (cd apps/comercio_app/build/web && python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 3
          cat > fotos.js <<'J'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const [nome, vp] of [['computador', { width: 1366, height: 768 }], ['celular', { width: 390, height: 844 }]]) {
              const ctx = await b.newContext({ viewport: vp });
              const p = await ctx.newPage();
              const erros = [];
              p.on('pageerror', (e) => erros.push(String(e)));
              await p.goto('http://localhost:8099/', { waitUntil: 'load', timeout: 90000 });
              await p.waitForTimeout(8000);
              await p.screenshot({ path: `comercio-web-${nome}.png` });
              console.log(nome, 'erros de pagina:', erros.length ? erros.slice(0, 5).join(' | ') : 'nenhum');
              await ctx.close();
            }
            await b.close();
          })();
          J
          node fotos.js
          mkdir -p /tmp/fotos && cp comercio-web-*.png /tmp/fotos/
      - name: Guardar as fotos no ramo fotos-comercio-web
        run: |
          cd /tmp/fotos && git init -q -b fotos-comercio-web
          git config user.name "CI Fortaleza"; git config user.email "ci@fortalezadigitalsecurity.com.br"
          git add -A && git commit -q -m "fotos do Comercio web ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fotos-comercio-web
      - name: Publicar no ramo do site (so no main)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/comercio_app/build/web
        run: |
          git init -q -b comercio-web-site
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          git add -A
          git commit -q -m "Comercio web ${{ github.run_number }} (commit ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" comercio-web-site
      - name: CORS (o servidor aceita pedidos vindos do site?)
        continue-on-error: true
        run: |
          SITE=https://fortaleza-move-comercio.onrender.com
          curl -s -o /dev/null -D - -X OPTIONS "https://fortaleza-mov-backend.onrender.com/api/auth/me" \
            -H "Origin: $SITE" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization" \
            | grep -i -E "^HTTP|access-control" | tee /tmp/cors.txt
          grep -qi "access-control-allow-origin" /tmp/cors.txt && echo "CORS: OK" || echo "CORS: FALTA liberar o site"
