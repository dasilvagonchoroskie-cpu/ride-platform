name: nestjs-11

# Atualiza SO o NestJS (core e common) para a versao 11 na API,
# confere build e teste e, se tudo passar, guarda package.json e
# pnpm-lock.yaml neste ramo. Nao toca na main nem no servidor.
on:
  push:
    branches: [nestjs-11]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    name: atualizar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - id: instalar
        run: pnpm install --frozen-lockfile
      - id: subir
        run: pnpm --filter @ride/backend up "@nestjs/core@^11" "@nestjs/common@^11" "@nestjs/platform-express@^11" "@nestjs/jwt@^11" "@nestjs/passport@^11" "@nestjs/swagger@^11" "@nestjs/testing@^11" "@nestjs/cli@^11" "@nestjs/config@^4" "@nestjs/schedule@^6"
      - id: versoes
        run: pnpm --filter @ride/backend list "@nestjs/*" zod file-type typescript --depth 0
      - id: shared
        run: pnpm --filter @ride/shared build
      - id: prisma
        run: pnpm --filter @ride/backend exec prisma generate
      - id: build
        run: pnpm --filter @ride/backend build
      - id: teste
        run: pnpm --filter @ride/backend test
      - id: auditoria
        continue-on-error: true
        run: pnpm audit --prod
      - id: guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apps/backend/package.json pnpm-lock.yaml
          git commit -m "API: NestJS core e common para a versao 11" || echo "nada para guardar"
          git push origin HEAD:nestjs-11
      - if: always()
        run: echo "RESULTADO nestjs-11 instalar=${{ steps.instalar.outcome }} subir=${{ steps.subir.outcome }} shared=${{ steps.shared.outcome }} prisma=${{ steps.prisma.outcome }} build=${{ steps.build.outcome }} teste=${{ steps.teste.outcome }} guardar=${{ steps.guardar.outcome }}"
