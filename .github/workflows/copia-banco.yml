name: Copia diaria do banco

# Evandro (10/10/2026): copia de seguranca diaria, de graca. Todas as tabelas,
# compactadas e CRIPTOGRAFADAS (so abre com a chave privada do Evandro).
# Fica guardada 30 dias nos artefatos desta esteira.
on:
  schedule:
    - cron: '23 6 * * *'   # 03:23 em Brasilia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: servidor-real
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o age (criptografia)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Baixar, conferir e criptografar
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OTP_CHAVE_TESTE: ${{ secrets.OTP_CHAVE_TESTE }}
          REL: /tmp/copia-banco.txt
          SAIDA: copia
        run: bash scripts/copia-banco.sh
      - name: Guardar a copia (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: copia-banco-${{ github.run_number }}
          path: copia/*.age
          retention-days: 30
          if-no-files-found: error
      - name: Guardar o relatorio
        if: always()
        run: |
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs && cp /tmp/copia-banco.txt logs/copia-banco.txt || exit 0
          git add logs/copia-banco.txt
          git commit -m "relatorio: copia do banco" || exit 0
          for t in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 5; done
