name: Trocar e-mail da Central

# Troca o e-mail de entrada da conta do dono da Central. Depois de rodar,
# atualize o segredo ADMIN_EMAIL do GitHub com o e-mail novo.
on:
  workflow_dispatch:
    inputs:
      novo_email:
        description: 'E-mail novo da Central'
        required: true

permissions:
  contents: read

concurrency:
  group: servidor-real
  cancel-in-progress: false

jobs:
  trocar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trocar
        env:
          ADMIN_EMAIL: fortalezamovegtba@gmail.com # e-mail publico da Central (11/11/2026); a protecao e o OTP_CHAVE_TESTE
          OTP_CHAVE_TESTE: ${{ secrets.OTP_CHAVE_TESTE }}
          NOVO_EMAIL: ${{ inputs.novo_email }}
        run: bash scripts/trocar-email-central.sh
