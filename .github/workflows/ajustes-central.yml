name: Ajustes da Central

# Ajustes de operacao pelas rotas da Central (o mesmo que o dono faz no app),
# sem mexer direto no banco. Ex.: cobranca TAXIMETRO (Evandro, 09/10/2026:
# "o valor do pedido e aproximado; quem conta e o taximetro do motorista").
on:
  workflow_dispatch:
    inputs:
      cobranca:
        description: 'Como cobrar a corrida (TAXIMETRO ou FECHADO); vazio = nao mexe'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: servidor-real
  cancel-in-progress: false

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OTP_CHAVE_TESTE: ${{ secrets.OTP_CHAVE_TESTE }}
          COBRANCA: ${{ inputs.cobranca }}
          REL: /tmp/ajustes-central.txt
        run: bash scripts/ajustes-central.sh
      - name: Guardar o relatorio
        if: always()
        run: |
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs && cp /tmp/ajustes-central.txt logs/ajustes-central.txt || exit 0
          git add logs/ajustes-central.txt
          git commit -m "relatorio: ajustes da Central" || exit 0
          for t in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 5; done
