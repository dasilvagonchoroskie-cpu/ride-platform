name: Android APKs

# ============================================================
# Build automatico dos APKs (Flutter / Dart).
#
# O job `validate` roda `flutter analyze` antes de qualquer compilacao:
# nenhum codigo com erro chega ao Gradle.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App a compilar'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'mobile_passenger', 'mobile_driver', 'central_app', 'taximetro']
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options: ['release', 'debug']
  push:
    branches: [main]
    paths:
      - 'apps/mobile_*/**'
      - '.github/workflows/android-apks.yml'

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

# Necessario para o job de validacao gravar o relatorio de erro de
# volta no repositorio (veja o passo "Guardar o relatorio").
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  validate:
    name: Validar ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [mobile_passenger, mobile_driver, central_app, taximetro]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versoes
        run: |
          flutter --version
          dart --version

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Analise estatica (flutter analyze)
        id: analyze
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze-${{ matrix.app }}.txt"

      # O token normal nao consegue ler o log de uma tarefa pela API.
      # Gravar o resultado aqui, no proprio repositorio, resolve isso.
      - name: Guardar o relatorio da analise
        if: always()
        run: |
          set -euo pipefail
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp "$RUNNER_TEMP/analyze-${{ matrix.app }}.txt" "logs/analyze-${{ matrix.app }}.txt"
          git add "logs/analyze-${{ matrix.app }}.txt"
          git commit -m "relatorio de analise: ${{ matrix.app }} (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "tentativa $t nao passou; repetindo"; sleep 5
          done

      - name: Falhar se a analise nao passou
        if: steps.analyze.outcome != 'success'
        run: exit 1

  build-apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile_passenger
            label: Passageiro
            artifact: ride-passenger-apk
            apk_name: ride-passenger
          - app: mobile_driver
            label: Motorista
            artifact: ride-driver-apk
            apk_name: ride-driver
          - app: central_app
            label: Central
            artifact: fortaleza-central-apk
            apk_name: fortaleza-central
          - app: taximetro
            label: Taximetro
            artifact: taximetro-apk
            apk_name: taximetro
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK disponivel
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          test -d "$SDK" || { echo "::error::Android SDK nao encontrado"; exit 1; }
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # Sem isto, o passageiro, o motorista e a central sairiam
      # assinados com a chave de depuracao — a Play Store rejeita.
      # Nao se aplica ao taximetro (fora do escopo desta rodada).
      - name: Preparar a assinatura de producao
        if: matrix.app != 'taximetro'
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA_LOJA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SENHA_CHAVE: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APELIDO: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64 — o APK sairia sem assinatura de producao."
            exit 1
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/assinatura.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/assinatura.jks" "$SENHA_LOJA" "$APELIDO" "$SENHA_CHAVE" \
            > "apps/${{ matrix.app }}/android/key.properties"
          echo "key.properties criado para ${{ matrix.app }}"

      - name: Compilar o APK
        id: compilar
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
            BUILD_TYPE=debug
          else
            BUILD_TYPE=release
          fi

          flutter build apk --$BUILD_TYPE --build-number=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.app }}.txt"

      # O token normal nao consegue ler o log de uma tarefa pela API.
      # Mesmo truque do job de validacao: grava o resultado no repositorio.
      - name: Guardar o relatorio da compilacao
        if: always() && steps.compilar.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp "$RUNNER_TEMP/build-${{ matrix.app }}.txt" "logs/build-${{ matrix.app }}.txt"
          git add "logs/build-${{ matrix.app }}.txt"
          git commit -m "relatorio de build: ${{ matrix.app }} (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "tentativa $t nao passou; repetindo"; sleep 5
          done

      - name: Falhar se a compilacao nao passou
        if: steps.compilar.outcome != 'success'
        run: |
          echo "A compilacao nao passou. O relatorio esta em logs/build-${{ matrix.app }}.txt"
          exit 1

      - name: Localizar o APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/apps/${{ matrix.app }}/build/app/outputs/flutter-apk"
          APK_PATH="$(find "$SRC" -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Nenhum APK em $SRC"
            find "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/build" -name '*.apk' | head -n 20 || true
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          FINAL="$OUT_DIR/${{ matrix.apk_name }}-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$FINAL"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FINAL" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$FINAL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$FINAL"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Artefato do GitHub Actions expira em 30 dias e so abre para quem
      # esta logado no GitHub. Um asset de Release fica disponivel para
      # sempre e a propria Actions API entrega o arquivo sem exigir
      # login no navegador — e o link que de fato se entrega ao cliente.
      - name: Publicar no Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-${{ matrix.apk_name }}-mais-recente"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "${{ matrix.label }} - APK mais recente" \
              --notes "Gerado automaticamente pelo GitHub Actions. Sempre o build mais recente da branch main." \
              --latest=false
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Resumo do build
        run: |
          {
            echo "### APK ${{ matrix.label }} gerado"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Arquivo | \`$(basename "${{ steps.apk.outputs.path }}")\` |"
            echo "| Tamanho | ${{ steps.apk.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| Stack | Flutter ${{ env.FLUTTER_VERSION }} |"
            echo "| Tipo | ${{ inputs.build_type || 'release' }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Baixe em **Artifacts > ${{ matrix.artifact }}** nesta execucao."
          } >> "$GITHUB_STEP_SUMMARY"
