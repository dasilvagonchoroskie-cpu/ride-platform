name: Android APKs

# ============================================================
# Build automatico dos APKs (Flutter / Dart).
#
# O job `validate` roda `flutter analyze` antes de qualquer compilacao:
# nenhum codigo com erro chega ao Gradle.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App a compilar: all, ou um ou mais separados por virgula (mobile_passenger, mobile_driver, central_app, comercio_app)'
        required: true
        default: 'all'
        type: string
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options: ['release', 'debug']
      gerar_aab:
        description: 'Gerar tambem o pacote da loja (AAB) de passageiro e motorista? (desmarque para so APK)'
        required: false
        default: true
        type: boolean
  # Pedido de mudanca: so analise e testes dos apps que mudaram (uma vez so,
  # para economizar minutos). APK/AAB pelo botao ou pela branch abaixo.
  pull_request:
    paths:
      - 'apps/mobile_*/**'
      - 'apps/central_app/**'
      - 'apps/comercio_app/**'
      - '.github/workflows/android-apks.yml'
  # Montagem das lojas: enviar para esta branch gera os APKs (passageiro,
  # motorista e Central) e os AABs (passageiro e motorista).
  push:
    branches: ['gerar-apk/lojas']

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

# Necessario para o job de validacao gravar o relatorio de erro de
# volta no repositorio (veja o passo "Guardar o relatorio").
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  # Escolhe quais aplicativos montar: pelo botao (um so ou todos) ou,
  # no envio de codigo, os tres. Assim um aplicativo em obra nao trava
  # a entrega de outro que ja esta pronto.
  preparar:
    name: Escolher aplicativos
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.escolha.outputs.apps }}
      builds: ${{ steps.escolha.outputs.builds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
      - id: escolha
        env:
          W_ESCOLHA: ${{ github.event.inputs.app }}
        run: |
          QUAL="${W_ESCOLHA}"
          # No pedido de mudanca: so os apps que mudaram (a esteira mudou = todos).
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            MUDOU=$(git diff --name-only "origin/${GITHUB_BASE_REF}...${GITHUB_SHA}")
            if echo "$MUDOU" | grep -q '^.github/workflows/android-apks.yml$'; then QUAL=all; else
              QUAL=$(echo "$MUDOU" | sed -n 's#^apps/\(mobile_passenger\|mobile_driver\|central_app\|comercio_app\)/.*#\1#p' | sort -u | paste -sd, -)
            fi
            [ -n "$QUAL" ] || QUAL=nenhum
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            QUAL=mobile_passenger,mobile_driver,central_app
          fi
          [ -z "$QUAL" ] && QUAL=all
          python3 - "$QUAL" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          todos = [
              {"app": "mobile_passenger", "label": "Passageiro", "artifact": "ride-passenger-apk", "apk_name": "ride-passenger"},
              {"app": "mobile_driver", "label": "Motorista", "artifact": "ride-driver-apk", "apk_name": "ride-driver"},
              {"app": "central_app", "label": "Central", "artifact": "fortaleza-central-apk", "apk_name": "fortaleza-central"},
              {"app": "comercio_app", "label": "Comércio", "artifact": "fortaleza-comercio-apk", "apk_name": "fortaleza-comercio"},
          ]
          qual = sys.argv[1]
          pedidos = [x.strip() for x in qual.split(",") if x.strip()]
          escolhidos = [a for a in todos if "all" in pedidos or a["app"] in pedidos]
          print("apps=" + json.dumps([a["app"] for a in escolhidos]))
          print("builds=" + json.dumps(escolhidos))
          PY

  validate:
    name: Validar ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: preparar
    if: needs.preparar.outputs.apps != '[]'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.preparar.outputs.apps) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versoes
        run: |
          flutter --version
          dart --version

      - name: Conferir chamadas do aplicativo contra as rotas do servidor
        run: python3 scripts/conferir-rotas.py

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Analise estatica (flutter analyze)
        id: analyze
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        # pipefail: sem ele o "tee" escondia o erro e a analise passava sempre.
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze-${{ matrix.app }}.txt"

      # Regras de cobranca e outras contas com teste automatico: se alguem
      # quebrar a conta, o APK nem chega a ser gerado.
      - name: Testes automaticos (flutter test)
        id: testes
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          if [ -d test ]; then flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test-${{ matrix.app }}.txt"; else echo "Sem testes neste app." | tee "$RUNNER_TEMP/test-${{ matrix.app }}.txt"; fi

      # O token normal nao consegue ler o log de uma tarefa pela API.
      # Gravar o resultado aqui, no proprio repositorio, resolve isso.
      - name: Guardar o relatorio da analise
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp "$RUNNER_TEMP/analyze-${{ matrix.app }}.txt" "logs/analyze-${{ matrix.app }}.txt"
          if [ -f "$RUNNER_TEMP/test-${{ matrix.app }}.txt" ]; then tail -c 60000 "$RUNNER_TEMP/test-${{ matrix.app }}.txt" > "logs/test-${{ matrix.app }}.txt"; git add "logs/test-${{ matrix.app }}.txt"; fi
          git add "logs/analyze-${{ matrix.app }}.txt"
          git commit -m "relatorio de analise: ${{ matrix.app }} (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            echo "tentativa $t nao passou; repetindo"; sleep 5
          done

      - name: Falhar se a analise ou os testes nao passaram
        if: steps.analyze.outcome != 'success' || steps.testes.outcome != 'success'
        run: exit 1

  build-apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [preparar, validate]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/gerar-apk/lojas')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preparar.outputs.builds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK disponivel
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          test -d "$SDK" || { echo "::error::Android SDK nao encontrado"; exit 1; }
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # Sem isto, o passageiro, o motorista e a central sairiam
      # assinados com a chave de depuracao — a Play Store rejeita.
      # Nao se aplica ao taximetro (fora do escopo desta rodada).
      - name: Preparar a assinatura de producao
        if: matrix.app != 'taximetro'
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA_LOJA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SENHA_CHAVE: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APELIDO: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64 — o APK sairia sem assinatura de producao."
            exit 1
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/assinatura.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/assinatura.jks" "$SENHA_LOJA" "$APELIDO" "$SENHA_CHAVE" \
            > "apps/${{ matrix.app }}/android/key.properties"
          echo "key.properties criado para ${{ matrix.app }}"

      # Push (Firebase) do passageiro e do motorista (Evandro criou o projeto
      # fortaleza-mov em 09/10/2026). Gera res/values/firebase.xml; sem ele o
      # aplicativo segue so com o vigia proprio.
      - name: Ligar o aviso push (Firebase)
        if: matrix.app == 'mobile_driver' || matrix.app == 'mobile_passenger'
        run: |
          set -euo pipefail
          python3 scripts/firebase-config.py infra/firebase-apps.b64
          # 20/11/2026: nomes de pacote novos (br.com.fortalezadigitalsecurity.move.*). Enquanto o
          # Firebase nao tiver o app Android com o nome novo, o APK sai SEM push (so o vigia proprio)
          # em vez de a esteira quebrar. Cadastrado no Firebase + infra/firebase-apps.b64 atualizado,
          # o push volta sozinho.
          if [ ! -f "apps/${{ matrix.app }}/android/app/src/main/res/values/firebase.xml" ]; then
            echo "::warning::Sem push neste APK: o Firebase ainda nao tem o app Android com o nome de pacote novo de ${{ matrix.app }}."
          fi

      # Google Maps (Evandro, 09/10/2026): a chave (restrita aos 3 apps e ao
      # Maps SDK, gratuito no celular) entra no manifesto; o app liga o mapa
      # do Google so se o servidor mandar (MAPA_PROVEDOR=google). Sem a chave,
      # fica a TomTom (desde 29/10/2026; a chave da TomTom vem do servidor).
      - name: Chave do Google Maps
        run: |
          set -euo pipefail
          if [ -s infra/mapas.b64 ]; then
            echo "::add-mask::$(base64 -d infra/mapas.b64)"
            echo "MAPS_API_KEY=$(base64 -d infra/mapas.b64)" >> "$GITHUB_ENV"
            echo "MAPA_DEFINE=--dart-define=MAPA_GOOGLE=true" >> "$GITHUB_ENV"
            echo "Google Maps ligado."
          else
            echo "Sem chave do Google: mapa TomTom."
          fi

      - name: Compilar o APK
        id: compilar
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        env:
          W_TIPO: ${{ inputs.build_type || 'release' }}
          W_APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "${W_TIPO}" = "debug" ]; then
            BUILD_TYPE=debug
          else
            BUILD_TYPE=release
          fi

          # Um APK por tipo de processador (08/10/2026): o APK unico, com os
          # tres tipos dentro, passava de 55 MB e nao cabia mais como anexo no
          # chat (limite de 30 MB). O de 64 bits (celulares de 2017 para ca)
          # fica com uns 21 MB; o de 32 bits vai junto para celular antigo.
          # Obs.: o Flutter soma 2000 (64 bits) ou 1000 (32 bits) ao numero da
          # versao, entao ele instala por cima do APK unico antigo.
          # Versao sobe sozinha: 1.0.<numero da montagem> (aparece no app).
          # Auditoria 06/11/2026: codigo Dart embaralhado na versao final (fica
          # mais dificil de copiar ou estudar o aplicativo). Os simbolos ficam
          # so na maquina da montagem: o repositorio e publico e publicar os
          # simbolos desfaria o embaralhamento.
          OFUSCAR=""
          if [ "$BUILD_TYPE" = release ]; then OFUSCAR="--obfuscate --split-debug-info=$GITHUB_WORKSPACE/simbolos/${W_APP}"; fi
          flutter build apk --$BUILD_TYPE --split-per-abi --build-number=${GITHUB_RUN_NUMBER} \
            --build-name=1.0.${GITHUB_RUN_NUMBER} --dart-define=APP_VERSION=1.0.${GITHUB_RUN_NUMBER} ${MAPA_DEFINE:-} $OFUSCAR \
            2>&1 | tee "$RUNNER_TEMP/build-${W_APP}.txt"

      # O token normal nao consegue ler o log de uma tarefa pela API.
      # Mesmo truque do job de validacao: grava o resultado no repositorio.
      - name: Guardar o relatorio da compilacao
        if: always() && steps.compilar.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp "$RUNNER_TEMP/build-${{ matrix.app }}.txt" "logs/build-${{ matrix.app }}.txt"
          git add "logs/build-${{ matrix.app }}.txt"
          git commit -m "relatorio de build: ${{ matrix.app }} (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            echo "tentativa $t nao passou; repetindo"; sleep 5
          done

      - name: Falhar se a compilacao nao passou
        if: steps.compilar.outcome != 'success'
        run: |
          echo "A compilacao nao passou. O relatorio esta em logs/build-${{ matrix.app }}.txt"
          exit 1

      - name: Localizar o APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/apps/${{ matrix.app }}/build/app/outputs/flutter-apk"
          APK_PATH="$(find "$SRC" -name '*arm64-v8a*.apk' -print -quit)"
          APK_32="$(find "$SRC" -name '*armeabi-v7a*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Nenhum APK em $SRC"
            find "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/build" -name '*.apk' | head -n 20 || true
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          FINAL="$OUT_DIR/${{ matrix.apk_name }}-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$FINAL"
          FINAL_32=""
          if [ -n "$APK_32" ]; then
            FINAL_32="$OUT_DIR/${{ matrix.apk_name }}-${{ github.run_number }}-32bits.apk"
            cp "$APK_32" "$FINAL_32"
          fi
          echo "path32=$FINAL_32" >> "$GITHUB_OUTPUT"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FINAL" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$FINAL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$FINAL"

      # Etapa 6 (30/10/2026): confere no APK pronto o nome que aparece no
      # celular, o icone redondo e (se gerado) o monocromatico do Android 13+.
      - name: Conferir nome e icones no APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          APK="${{ steps.apk.outputs.path }}"
          case "${{ matrix.app }}" in
            mobile_passenger) NOME="Fortaleza Move" ;;
            mobile_driver) NOME="Fortaleza Move Motorista" ;;
            central_app) NOME="Fortaleza Move Central" ;;
            comercio_app) NOME="Fortaleza Move Comércio" ;;
          esac
          "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "application-label:'$NOME'" "$RUNNER_TEMP/badging.txt" || { echo "::error::Nome no celular nao e '$NOME'"; grep application-label "$RUNNER_TEMP/badging.txt" || true; exit 1; }
          grep -q "application-icon-" "$RUNNER_TEMP/badging.txt" || { echo "::error::APK sem icone"; exit 1; }
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q 'roundIcon' || { echo "::error::Sem android:roundIcon"; exit 1; }
          "$AAPT2" dump resources "$APK" > "$RUNNER_TEMP/recursos.txt"
          if ls apps/${{ matrix.app }}/android/app/src/main/res/mipmap-*/ic_launcher_monochrome.png >/dev/null 2>&1; then
            grep -q 'mipmap/ic_launcher_monochrome' "$RUNNER_TEMP/recursos.txt" || { echo "::error::Sem o icone monocromatico"; exit 1; }
            MONO="com monocromatico"
          else
            MONO="sem monocromatico (simbolo novo ainda nao gerado)"
          fi
          echo "OK: '$NOME', icone redondo, $MONO"
          # Exigencias da Google Play (Etapa 7): alvo Android 16 (API 36) desde
          # 31/08/2026 e bibliotecas nativas alinhadas em 16 KB. So avisa: a
          # Central nao vai para a loja e o APK de teste continua saindo.
          ALVO="$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/badging.txt")"
          if [ "${ALVO:-0}" -ge 36 ]; then echo "OK: alvo Android API $ALVO"; else echo "::warning::alvo API ${ALVO:-?}: a Google Play exige 36 desde 31/08/2026"; fi
          ZIPALIGN="$(ls -d "$SDK"/build-tools/*/zipalign | sort -V | tail -n 1)"
          if "$ZIPALIGN" -c -P 16 -v 4 "$APK" > "$RUNNER_TEMP/zipalign.txt" 2>&1; then echo "OK: bibliotecas nativas alinhadas em 16 KB"; else echo "::warning::bibliotecas nativas sem alinhamento de 16 KB"; grep -i 'BAD' "$RUNNER_TEMP/zipalign.txt" | head -n 5 || true; fi

      # Pacote da loja (AAB) para a Google Play (Evandro aprovou em
      # 09/10/2026). So passageiro e motorista: a Central fica fora da loja
      # (so a equipe usa). Mesma assinatura do APK = chave de envio da Play.
      - name: Compilar o pacote da loja (AAB)
        id: aab
        if: (matrix.app == 'mobile_passenger' || matrix.app == 'mobile_driver') && (inputs.build_type || 'release') == 'release' && (inputs.gerar_aab || github.event_name == 'push')
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }} ${MAPA_DEFINE:-} \
            --obfuscate --split-debug-info="$GITHUB_WORKSPACE/simbolos/${{ matrix.app }}" \
            2>&1 | tail -n 30
          AAB="$(find build/app/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB" || { echo "::error::AAB nao foi gerado"; exit 1; }
          FINAL="$GITHUB_WORKSPACE/dist/${{ matrix.apk_name }}-${{ github.run_number }}.aab"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$AAB" "$FINAL"
          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          ls -la "$FINAL"

      # So o Release guarda os APKs/AAB (29/10/2026: o artefato da execucao
      # duplicava tudo e passava de 4 GB; o plano gratis privado tem 500 MB).
      - name: Publicar no Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-${{ matrix.apk_name }}-mais-recente"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "${{ matrix.label }} - APK mais recente" \
              --notes "Gerado automaticamente pelo GitHub Actions. Sempre o build mais recente da branch main." \
              --latest=false
          fi
          # Primeiro o de 32 bits, depois o principal (64 bits): assim o
          # ultimo enviado e sempre o principal.
          if [ -n "${{ steps.apk.outputs.path32 }}" ]; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path32 }}" \
              --repo "${{ github.repository }}" --clobber
          fi
          if [ -n "${{ steps.aab.outputs.path }}" ]; then
            gh release upload "$TAG" "${{ steps.aab.outputs.path }}" \
              --repo "${{ github.repository }}" --clobber
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Resumo do build
        env:
          W_APP_ROTULO: ${{ matrix.label }}
          W_APK: ${{ steps.apk.outputs.path }}
          W_TAMANHO: ${{ steps.apk.outputs.size }}
          W_SHA256: ${{ steps.apk.outputs.sha256 }}
          W_TIPO: ${{ inputs.build_type || 'release' }}
          W_APK_NOME: ${{ matrix.apk_name }}
        run: |
          {
            echo "### APK ${W_APP_ROTULO} gerado"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Arquivo | \`$(basename "${W_APK}")\` |"
            echo "| Tamanho | ${W_TAMANHO} |"
            echo "| SHA-256 | \`${W_SHA256}\` |"
            echo "| Stack | Flutter ${FLUTTER_VERSION} |"
            echo "| Tipo | ${W_TIPO} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo ""
            echo "Baixe no Release **apk-${W_APK_NOME}-mais-recente**."
          } >> "$GITHUB_STEP_SUMMARY"
