name: Android APKs

# ============================================================
# Build automatico dos APKs instalaveis (release, bundle embutido).
#
# Para adicionar um novo app (ex.: motorista), basta incluir uma entrada
# na matriz `apps` do job build-apk — nenhuma outra mudanca e necessaria.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App a compilar'
        required: true
        default: 'all'
        type: choice
        options: ['all', 'mobile-passenger']
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options: ['release', 'debug']
  push:
    branches: [main]
    paths:
      - 'apps/mobile-*/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apks.yml'

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # ABIs alvo: cobre praticamente todos os aparelhos Android atuais e
  # reduz o tempo de build (x86/x86_64 sao apenas para emulador).
  TARGET_ABIS: 'arm64-v8a,armeabi-v7a'

jobs:
  # ------------------------------------------------------------------
  # 1) Validacao estatica — nada com erro de tipo ou lint passa daqui.
  #    E o "self-healing gate": o build so comeca com o codigo limpo.
  # ------------------------------------------------------------------
  validate:
    name: Validar ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [mobile-passenger]
    steps:
      - uses: actions/checkout@v4

      # A versao do pnpm vem de package.json > packageManager (corepack).
      # Declarar tambem no action causa erro de versao duplicada.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar @ride/shared
        run: pnpm --filter @ride/shared build

      - name: Typecheck
        run: pnpm --filter @ride/${{ matrix.app }} exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @ride/${{ matrix.app }} exec eslint . --ext .ts,.tsx --max-warnings 0

  # ------------------------------------------------------------------
  # 2) Build do APK
  # ------------------------------------------------------------------
  build-apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile-passenger
            label: Passageiro
            artifact: ride-passenger-apk
            apk_name: ride-passenger
          # Para incluir o app do motorista, descomente e ajuste:
          # - app: mobile-driver
          #   label: Motorista
          #   artifact: ride-driver-apk
          #   apk_name: ride-driver
    steps:
      - uses: actions/checkout@v4

      # A versao do pnpm vem de package.json > packageManager (corepack).
      # Declarar tambem no action causa erro de versao duplicada.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('apps/*/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.app }}-
            gradle-${{ runner.os }}-

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar @ride/shared
        run: pnpm --filter @ride/shared build

      - name: Gerar o projeto Android (expo prebuild)
        working-directory: apps/${{ matrix.app }}
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Conferir o projeto nativo gerado
        working-directory: apps/${{ matrix.app }}/android
        run: |
          test -x gradlew || { echo "gradlew ausente — prebuild falhou"; exit 1; }
          test -f gradle.properties || { echo "gradle.properties ausente"; exit 1; }
          test -f settings.gradle || { echo "settings.gradle ausente"; exit 1; }
          echo "projeto nativo OK"

      - name: Ajustar gradle.properties
        working-directory: apps/${{ matrix.app }}/android
        run: |
          set -euo pipefail

          set_prop() {
            local key="$1" value="$2"
            if grep -q "^${key}=" gradle.properties; then
              sed -i "s|^${key}=.*|${key}=${value}|" gradle.properties
            else
              echo "${key}=${value}" >> gradle.properties
            fi
          }

          set_prop reactNativeArchitectures "${{ env.TARGET_ABIS }}"
          set_prop newArchEnabled false
          set_prop org.gradle.jvmargs "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          set_prop org.gradle.parallel true
          set_prop org.gradle.caching true

          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Garantir a keystore de assinatura
        working-directory: apps/${{ matrix.app }}/android/app
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Compilar o APK
        working-directory: apps/${{ matrix.app }}/android
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=${TARGET_ABIS}
          else
            ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=${TARGET_ABIS}
          fi

      - name: Publicar o APK como artefato
        id: apk
        working-directory: apps/${{ matrix.app }}/android
        run: |
          set -euo pipefail
          APK_PATH="$(find "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/android/app/build/outputs/apk" -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Nenhum APK encontrado. Conteudo de build/outputs:"
            find "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/android/app/build/outputs" -type f | head -n 50
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          FINAL="$OUT_DIR/${{ matrix.apk_name }}-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$FINAL"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FINAL" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$FINAL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$FINAL"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resumo do build
        run: |
          {
            echo "### APK ${{ matrix.label }} gerado"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Arquivo | \`$(basename "${{ steps.apk.outputs.path }}")\` |"
            echo "| Tamanho | ${{ steps.apk.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| Tipo | ${{ inputs.build_type || 'release' }} |"
            echo "| ABIs | \`${{ env.TARGET_ABIS }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Baixe em **Artifacts > ${{ matrix.artifact }}** nesta execucao."
          } >> "$GITHUB_STEP_SUMMARY"
