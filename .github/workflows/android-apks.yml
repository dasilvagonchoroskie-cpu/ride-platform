name: Android APKs

# ============================================================
# Build automatico dos APKs (Flutter / Dart).
#
# O job `validate` roda `flutter analyze` antes de qualquer compilacao:
# nenhum codigo com erro chega ao Gradle.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App a compilar: all, ou um ou mais separados por virgula (mobile_passenger, mobile_driver, central_app)'
        required: true
        default: 'all'
        type: string
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options: ['release', 'debug']
  push:
    branches: [main]
    paths:
      - 'apps/mobile_*/**'
      - 'apps/central_app/**'
      - '.github/workflows/android-apks.yml'

concurrency:
  group: android-apks-${{ github.ref }}
  cancel-in-progress: true

# Necessario para o job de validacao gravar o relatorio de erro de
# volta no repositorio (veja o passo "Guardar o relatorio").
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'

jobs:
  # Escolhe quais aplicativos montar: pelo botao (um so ou todos) ou,
  # no envio de codigo, os tres. Assim um aplicativo em obra nao trava
  # a entrega de outro que ja esta pronto.
  preparar:
    name: Escolher aplicativos
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.escolha.outputs.apps }}
      builds: ${{ steps.escolha.outputs.builds }}
    steps:
      - id: escolha
        run: |
          QUAL="${{ github.event.inputs.app }}"
          [ -z "$QUAL" ] && QUAL=all
          python3 - "$QUAL" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          todos = [
              {"app": "mobile_passenger", "label": "Passageiro", "artifact": "ride-passenger-apk", "apk_name": "ride-passenger"},
              {"app": "mobile_driver", "label": "Motorista", "artifact": "ride-driver-apk", "apk_name": "ride-driver"},
              {"app": "central_app", "label": "Central", "artifact": "fortaleza-central-apk", "apk_name": "fortaleza-central"},
          ]
          qual = sys.argv[1]
          pedidos = [x.strip() for x in qual.split(",") if x.strip()]
          escolhidos = [a for a in todos if "all" in pedidos or a["app"] in pedidos]
          print("apps=" + json.dumps([a["app"] for a in escolhidos]))
          print("builds=" + json.dumps(escolhidos))
          PY

  # Junto com os aplicativos, o servidor: se o codigo do servidor no GitHub
  # for mais novo que o que esta no ar, manda o Render publicar (com o
  # segredo RENDER_DEPLOY_HOOK). Roda em paralelo e nao atrasa os APKs.
  servidor:
    name: Servidor em dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir e publicar o servidor
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set +e
          bash scripts/servidor-em-dia.sh
          r=$?
          if [ $r -eq 2 ]; then echo "::warning::Servidor desatualizado e sem RENDER_DEPLOY_HOOK para publicar sozinho."; fi
          if [ $r -eq 1 ]; then echo "::warning::O Render nao publicou a versao nova a tempo."; fi
          exit 0

  validate:
    name: Validar ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: preparar
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.preparar.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versoes
        run: |
          flutter --version
          dart --version

      - name: Conferir chamadas do aplicativo contra as rotas do servidor
        run: python3 scripts/conferir-rotas.py

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Analise estatica (flutter analyze)
        id: analyze
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        # pipefail: sem ele o "tee" escondia o erro e a analise passava sempre.
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze-${{ matrix.app }}.txt"

      # Regras de cobranca e outras contas com teste automatico: se alguem
      # quebrar a conta, o APK nem chega a ser gerado.
      - name: Testes automaticos (flutter test)
        id: testes
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          if [ -d test ]; then flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test-${{ matrix.app }}.txt"; else echo "Sem testes neste app." | tee "$RUNNER_TEMP/test-${{ matrix.app }}.txt"; fi

      # O token normal nao consegue ler o log de uma tarefa pela API.
      # Gravar o resultado aqui, no proprio repositorio, resolve isso.
      - name: Guardar o relatorio da analise
        if: always()
        run: |
          set -euo pipefail
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp "$RUNNER_TEMP/analyze-${{ matrix.app }}.txt" "logs/analyze-${{ matrix.app }}.txt"
          if [ -f "$RUNNER_TEMP/test-${{ matrix.app }}.txt" ]; then tail -c 60000 "$RUNNER_TEMP/test-${{ matrix.app }}.txt" > "logs/test-${{ matrix.app }}.txt"; git add "logs/test-${{ matrix.app }}.txt"; fi
          git add "logs/analyze-${{ matrix.app }}.txt"
          git commit -m "relatorio de analise: ${{ matrix.app }} (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "tentativa $t nao passou; repetindo"; sleep 5
          done

      - name: Falhar se a analise ou os testes nao passaram
        if: steps.analyze.outcome != 'success' || steps.testes.outcome != 'success'
        run: exit 1

  build-apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [preparar, validate]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preparar.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK disponivel
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          test -d "$SDK" || { echo "::error::Android SDK nao encontrado"; exit 1; }
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # Sem isto, o passageiro, o motorista e a central sairiam
      # assinados com a chave de depuracao — a Play Store rejeita.
      # Nao se aplica ao taximetro (fora do escopo desta rodada).
      - name: Preparar a assinatura de producao
        if: matrix.app != 'taximetro'
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SENHA_LOJA: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SENHA_CHAVE: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APELIDO: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$CHAVE" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64 — o APK sairia sem assinatura de producao."
            exit 1
          fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/assinatura.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/assinatura.jks" "$SENHA_LOJA" "$APELIDO" "$SENHA_CHAVE" \
            > "apps/${{ matrix.app }}/android/key.properties"
          echo "key.properties criado para ${{ matrix.app }}"

      - name: Compilar o APK
        id: compilar
        continue-on-error: true
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type || 'release' }}" = "debug" ]; then
            BUILD_TYPE=debug
          else
            BUILD_TYPE=release
          fi

          # Um APK por tipo de processador (08/10/2026): o APK unico, com os
          # tres tipos dentro, passava de 55 MB e nao cabia mais como anexo no
          # chat (limite de 30 MB). O de 64 bits (celulares de 2017 para ca)
          # fica com uns 21 MB; o de 32 bits vai junto para celular antigo.
          # Obs.: o Flutter soma 2000 (64 bits) ou 1000 (32 bits) ao numero da
          # versao, entao ele instala por cima do APK unico antigo.
          # Versao sobe sozinha: 1.0.<numero da montagem> (aparece no app).
          flutter build apk --$BUILD_TYPE --split-per-abi --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/build-${{ matrix.app }}.txt"

      # O token normal nao consegue ler o log de uma tarefa pela API.
      # Mesmo truque do job de validacao: grava o resultado no repositorio.
      - name: Guardar o relatorio da compilacao
        if: always() && steps.compilar.outcome != 'skipped'
        run: |
          set -euo pipefail
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp "$RUNNER_TEMP/build-${{ matrix.app }}.txt" "logs/build-${{ matrix.app }}.txt"
          git add "logs/build-${{ matrix.app }}.txt"
          git commit -m "relatorio de build: ${{ matrix.app }} (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "tentativa $t nao passou; repetindo"; sleep 5
          done

      - name: Falhar se a compilacao nao passou
        if: steps.compilar.outcome != 'success'
        run: |
          echo "A compilacao nao passou. O relatorio esta em logs/build-${{ matrix.app }}.txt"
          exit 1

      - name: Localizar o APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/apps/${{ matrix.app }}/build/app/outputs/flutter-apk"
          APK_PATH="$(find "$SRC" -name '*arm64-v8a*.apk' -print -quit)"
          APK_32="$(find "$SRC" -name '*armeabi-v7a*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Nenhum APK em $SRC"
            find "$GITHUB_WORKSPACE/apps/${{ matrix.app }}/build" -name '*.apk' | head -n 20 || true
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT_DIR"
          FINAL="$OUT_DIR/${{ matrix.apk_name }}-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$FINAL"
          FINAL_32=""
          if [ -n "$APK_32" ]; then
            FINAL_32="$OUT_DIR/${{ matrix.apk_name }}-${{ github.run_number }}-32bits.apk"
            cp "$APK_32" "$FINAL_32"
          fi
          echo "path32=$FINAL_32" >> "$GITHUB_OUTPUT"

          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FINAL" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$FINAL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$FINAL"

      # Pacote da loja (AAB) para a Google Play (Evandro aprovou em
      # 09/10/2026). So passageiro e motorista: a Central fica fora da loja
      # (so a equipe usa). Mesma assinatura do APK = chave de envio da Play.
      - name: Compilar o pacote da loja (AAB)
        id: aab
        if: (matrix.app == 'mobile_passenger' || matrix.app == 'mobile_driver') && (inputs.build_type || 'release') == 'release'
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          flutter build appbundle --release --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} --dart-define=APP_VERSION=1.0.${{ github.run_number }} \
            2>&1 | tail -n 30
          AAB="$(find build/app/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$AAB" || { echo "::error::AAB nao foi gerado"; exit 1; }
          FINAL="$GITHUB_WORKSPACE/dist/${{ matrix.apk_name }}-${{ github.run_number }}.aab"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$AAB" "$FINAL"
          echo "path=$FINAL" >> "$GITHUB_OUTPUT"
          ls -la "$FINAL"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path32 }}
            ${{ steps.aab.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Artefato do GitHub Actions expira em 30 dias e so abre para quem
      # esta logado no GitHub. Um asset de Release fica disponivel para
      # sempre e a propria Actions API entrega o arquivo sem exigir
      # login no navegador — e o link que de fato se entrega ao cliente.
      - name: Publicar no Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-${{ matrix.apk_name }}-mais-recente"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "${{ matrix.label }} - APK mais recente" \
              --notes "Gerado automaticamente pelo GitHub Actions. Sempre o build mais recente da branch main." \
              --latest=false
          fi
          # Primeiro o de 32 bits, depois o principal (64 bits): assim o
          # ultimo enviado e sempre o principal.
          if [ -n "${{ steps.apk.outputs.path32 }}" ]; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path32 }}" \
              --repo "${{ github.repository }}" --clobber
          fi
          if [ -n "${{ steps.aab.outputs.path }}" ]; then
            gh release upload "$TAG" "${{ steps.aab.outputs.path }}" \
              --repo "${{ github.repository }}" --clobber
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Resumo do build
        run: |
          {
            echo "### APK ${{ matrix.label }} gerado"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Arquivo | \`$(basename "${{ steps.apk.outputs.path }}")\` |"
            echo "| Tamanho | ${{ steps.apk.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| Stack | Flutter ${{ env.FLUTTER_VERSION }} |"
            echo "| Tipo | ${{ inputs.build_type || 'release' }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Baixe em **Artifacts > ${{ matrix.artifact }}** nesta execucao."
          } >> "$GITHUB_STEP_SUMMARY"
