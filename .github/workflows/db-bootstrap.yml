name: Preparar o banco de dados

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Gerar o cliente Prisma
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma generate

      - name: Criar as tabelas (db push)
        id: push
        continue-on-error: true
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p /tmp/rel
          pnpm exec prisma db push --accept-data-loss --skip-generate 2>&1 | tee /tmp/rel/saida.txt

      - name: Indices espaciais, triggers e views (post-init)
        id: postinit
        if: steps.push.outcome == 'success'
        continue-on-error: true
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: set -o pipefail; pnpm exec prisma db execute --file prisma/sql/post-init.sql --schema prisma/schema.prisma 2>&1 | tee -a /tmp/rel/saida.txt

      - name: Semear as bandeiras de tarifa
        id: seed
        if: steps.push.outcome == 'success'
        continue-on-error: true
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: set -o pipefail; pnpm exec tsx prisma/seed.ts 2>&1 | tee -a /tmp/rel/saida.txt

      - name: Guardar o relatorio
        if: always()
        run: |
          {
            echo ""; echo "=== resultado ==="
            echo "push:     ${{ steps.push.outcome }}"
            echo "postinit: ${{ steps.postinit.outcome }}"
            echo "seed:     ${{ steps.seed.outcome }}"
          } >> /tmp/rel/saida.txt
          git config user.name  "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp /tmp/rel/saida.txt logs/db-bootstrap.txt
          git add logs/db-bootstrap.txt
          git commit -m "relatorio: preparacao do banco (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 5
          done

      - name: Falhar se algo deu errado
        if: steps.push.outcome != 'success' || steps.postinit.outcome != 'success' || steps.seed.outcome != 'success'
        run: |
          echo "Alguma etapa falhou. Veja logs/db-bootstrap.txt no repositorio."
          exit 1
