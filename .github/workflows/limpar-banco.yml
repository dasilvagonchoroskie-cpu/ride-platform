name: Limpar o banco (dados de teste)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'listar (so mostra) ou zerar_e_limpar (copia, zera a operacao e apaga as contas fora da lista)'
        required: true
        default: 'listar'
        type: choice
        options: ['listar', 'zerar_e_limpar']
      manter:
        description: 'Telefones que ficam (separados por virgula)'
        required: false
        default: '+5564992686632,+5564996472794,+5554996421415'

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limpar
        env:
          ACAO: ${{ github.event.inputs.acao }}
          MANTER: ${{ github.event.inputs.manter }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OTP_CHAVE_TESTE: ${{ secrets.OTP_CHAVE_TESTE }}
          REL: /tmp/limpeza.txt
        run: bash scripts/limpar-banco.sh
      - name: Guardar o relatorio
        if: always()
        run: |
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs
          cp /tmp/limpeza.txt logs/limpeza-banco.txt || exit 0
          git add logs/limpeza-banco.txt
          git commit -m "relatorio: limpeza do banco (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 5; done
