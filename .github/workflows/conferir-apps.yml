name: Conferir Central e Motorista

# So ANALISE e TESTES (flutter analyze e flutter test) dos apps Central e Motorista,
# em qualquer branch que nao seja a principal. Nao gera APK, nao publica nada,
# nao usa segredo e nao faz deploy (12/11/2026).
on:
  workflow_dispatch: {}
  push:
    branches-ignore: [main]
    paths:
      - 'apps/central_app/**'
      - 'apps/mobile_driver/**'
      - 'scripts/conferir-rotas.py'
      - '.github/workflows/conferir-apps.yml'

concurrency:
  group: conferir-apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  conferir:
    name: Conferir ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [central_app, mobile_driver]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Conferir chamadas dos aplicativos contra as rotas do servidor
        run: python3 scripts/conferir-rotas.py

      - name: Resolver dependencias
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Analise estatica (flutter analyze)
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze

      - name: Testes automaticos (flutter test)
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -d test ]; then flutter test --reporter expanded; else echo "Sem testes neste app."; fi
