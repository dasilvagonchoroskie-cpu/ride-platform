name: Testes do servidor

# Roda os testes do servidor (jest) a cada pedido de mudanca e a cada envio
# no main que mexe no servidor. Relatorio em logs/testes-servidor.txt (main).
on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/testes-servidor.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/testes-servidor.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Montar e testar
        run: |
          set -o pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @ride/shared build
          pnpm --filter @ride/backend exec prisma generate
          pnpm --filter @ride/backend exec tsc --noEmit -p tsconfig.json
          pnpm --filter @ride/backend build
          pnpm --filter @ride/backend exec jest --config jest.config.js --ci 2>&1 | tee /tmp/testes.txt
