name: correcoes-seguranca

# Experimento de seguranca: NAO publica nada, NAO mexe no servidor, NAO mexe na main.
# Roda so no ramo correcoes-seguranca. Cada job imprime uma linha "RESULTADO ..." no final do log.

on:
  push:
    branches: [correcoes-seguranca]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-antes:
    name: api-antes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - id: instalar
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - id: shared
        continue-on-error: true
        run: pnpm --filter @ride/shared build
      - id: prisma
        continue-on-error: true
        run: pnpm --filter @ride/backend exec prisma generate
      - id: build
        continue-on-error: true
        run: pnpm --filter @ride/backend build
      - id: teste
        continue-on-error: true
        run: pnpm --filter @ride/backend test
      - if: always()
        run: echo "RESULTADO api-antes instalar=${{ steps.instalar.outcome }} shared=${{ steps.shared.outcome }} prisma=${{ steps.prisma.outcome }} build=${{ steps.build.outcome }} teste=${{ steps.teste.outcome }}"

  api-depois:
    name: api-depois
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - id: instalar
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - id: subir
        continue-on-error: true
        run: pnpm --filter @ride/backend up "@nestjs/core@^11" "@nestjs/common@^11"
      - id: versoes
        continue-on-error: true
        run: pnpm --filter @ride/backend list "@nestjs/core" "@nestjs/common" zod file-type typescript --depth 0
      - id: shared
        continue-on-error: true
        run: pnpm --filter @ride/shared build
      - id: prisma
        continue-on-error: true
        run: pnpm --filter @ride/backend exec prisma generate
      - id: build
        continue-on-error: true
        run: pnpm --filter @ride/backend build
      - id: teste
        continue-on-error: true
        run: pnpm --filter @ride/backend test
      - if: always()
        run: echo "RESULTADO api-depois instalar=${{ steps.instalar.outcome }} subir=${{ steps.subir.outcome }} shared=${{ steps.shared.outcome }} prisma=${{ steps.prisma.outcome }} build=${{ steps.build.outcome }} teste=${{ steps.teste.outcome }}"

  crm:
    name: crm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: instalar
        continue-on-error: true
        working-directory: crm
        run: npm ci
      - id: teste
        continue-on-error: true
        working-directory: crm
        run: npm test
      - if: always()
        run: echo "RESULTADO crm instalar=${{ steps.instalar.outcome }} teste=${{ steps.teste.outcome }}"

  imagens:
    name: imagens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfiles com Node 22 (copias temporarias)
        run: |
          sed 's/node:20-alpine/node:22-alpine/g' apps/backend/Dockerfile > /tmp/api.Dockerfile
          sed 's/node:20-alpine/node:22-alpine/g' crm/Dockerfile > /tmp/crm.Dockerfile
      - id: api_build
        continue-on-error: true
        run: docker build -f /tmp/api.Dockerfile -t fm-api:teste .
      - id: crm_build
        continue-on-error: true
        run: docker build -f /tmp/crm.Dockerfile -t fm-crm:teste crm
      - id: api_scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json fm-api:teste 2>/dev/null > /tmp/api.json
          echo "ALTAS_E_CRITICAS_API=$(jq '[.Results[]?.Vulnerabilities[]?] | length' /tmp/api.json) CRITICAS_API=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /tmp/api.json)"
      - id: crm_scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json fm-crm:teste 2>/dev/null > /tmp/crm.json
          echo "ALTAS_E_CRITICAS_CRM=$(jq '[.Results[]?.Vulnerabilities[]?] | length' /tmp/crm.json) CRITICAS_CRM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' /tmp/crm.json)"
      - if: always()
        run: echo "RESULTADO imagens api_build=${{ steps.api_build.outcome }} crm_build=${{ steps.crm_build.outcome }} api_scan=${{ steps.api_scan.outcome }} crm_scan=${{ steps.crm_scan.outcome }}"
