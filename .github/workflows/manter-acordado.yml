name: Manter o servidor acordado

# O plano gratis do Render dorme o servidor depois de 15 min sem uso, e a
# primeira abertura (app ou Central na web) demora minutos para acordar
# (Evandro, 11/11/2026: "demorou quase 5 minutos para abrir"). Um toque a cada 14 min
# mantem acordado (repositorio publico: minutos gratis sem limite). So o servidor da plataforma (750 h gratis
# por mes cobrem um servico ligado o mes todo).
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  tocar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tocar o servidor e o site da Central
        run: |
          for i in 1 2 3; do
            C=$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' -m 120 https://fortaleza-mov-backend.onrender.com/api/health) && echo "servidor: $C" && break
            sleep 10
          done
          curl -s -o /dev/null -w 'site: %{http_code} %{time_total}s\n' -m 60 https://fortaleza-move-central.onrender.com/ || true
