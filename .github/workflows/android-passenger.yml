name: Android APK — App do Passageiro

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options: ['release', 'debug']
  push:
    branches: [main]
    paths:
      - 'apps/mobile-passenger/**'
      - 'packages/shared/**'
      - '.github/workflows/android-passenger.yml'

concurrency:
  group: android-passenger-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'

jobs:
  # ------------------------------------------------------------------
  # 1) Validacao: nenhum codigo com erro de tipo ou lint passa daqui
  # ------------------------------------------------------------------
  validate:
    name: Validar (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar @ride/shared
        run: pnpm --filter @ride/shared build

      - name: Typecheck do app do passageiro
        run: pnpm --filter @ride/mobile-passenger exec tsc --noEmit

      - name: Lint do app do passageiro
        run: pnpm --filter @ride/mobile-passenger exec eslint . --ext .ts,.tsx --max-warnings 0
        continue-on-error: false

  # ------------------------------------------------------------------
  # 2) Build do APK
  # ------------------------------------------------------------------
  build-apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile-passenger/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Compilar @ride/shared
        run: pnpm --filter @ride/shared build

      - name: Gerar o projeto Android (expo prebuild)
        working-directory: apps/mobile-passenger
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx expo prebuild --platform android --no-install

      - name: Ajustar gradle.properties (ABIs e memoria)
        working-directory: apps/mobile-passenger/android
        run: |
          # APK universal para arm64 + arm32 (cobre praticamente todos os aparelhos)
          if grep -q '^reactNativeArchitectures=' gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' gradle.properties
          else
            echo 'reactNativeArchitectures=arm64-v8a,armeabi-v7a' >> gradle.properties
          fi
          # Sem New Architecture para reduzir tempo e risco de build
          if grep -q '^newArchEnabled=' gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' gradle.properties
          else
            echo 'newArchEnabled=false' >> gradle.properties
          fi
          if grep -q '^org.gradle.jvmargs=' gradle.properties; then
            sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m|' gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' >> gradle.properties
          fi
          echo '--- gradle.properties ---'
          cat gradle.properties

      - name: Garantir keystore de assinatura
        working-directory: apps/mobile-passenger/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Build do APK (assembleRelease)
        working-directory: apps/mobile-passenger/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Localizar o APK gerado
        id: apk
        working-directory: apps/mobile-passenger/android
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Nenhum APK encontrado em app/build/outputs/apk"
            find app/build/outputs -type f | head -n 50
            exit 1
          fi
          APK_NAME="ride-passenger-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(du -h "$APK_NAME" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$APK_NAME"

      - name: Enviar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ride-passenger-apk
          path: apps/mobile-passenger/android/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resumo do build
        run: |
          {
            echo "### APK gerado com sucesso"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Arquivo | \`${{ steps.apk.outputs.apk_path }}\` |"
            echo "| Tamanho | ${{ steps.apk.outputs.apk_size }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo ""
            echo "Baixe em **Artifacts > ride-passenger-apk** nesta execucao."
          } >> "$GITHUB_STEP_SUMMARY"
