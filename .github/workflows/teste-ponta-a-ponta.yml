name: Teste de ponta a ponta

# Percorre no servidor REAL o caminho completo: Central, passageiro,
# motorista, aprovacao e uma corrida inteira. Grava o relatorio em logs/.
on:
  workflow_dispatch: {}

permissions:
  contents: write

# Os dois entram como a Central pelo codigo do e-mail: rodando juntos, um
# invalidava o codigo do outro (08/10/2026). Ficam em fila.
concurrency:
  group: servidor-real
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Antes de testar: o servidor no ar tem que ser o do codigo atual
      # (atualiza sozinho com RENDER_DEPLOY_HOOK; sem ele, avisa no topo
      # do relatorio e o teste falha).
      - name: Servidor em dia
        id: servidor
        continue-on-error: true
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -o pipefail
          bash scripts/servidor-em-dia.sh 2>&1 | tee /tmp/servidor.txt
      - name: Rodar o teste no servidor real
        id: teste
        continue-on-error: true
        env:
          ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OTP_CHAVE_TESTE: ${{ secrets.OTP_CHAVE_TESTE }}
          REL: /tmp/relatorio.txt
        run: bash scripts/teste-ponta-a-ponta.sh
      - name: Guardar o relatorio
        if: always()
        run: |
          git config user.name "CI Fortaleza"
          git config user.email "ci@fortalezadigitalsecurity.com.br"
          mkdir -p logs && cat /tmp/servidor.txt /tmp/relatorio.txt > logs/teste-ponta-a-ponta.txt 2>/dev/null || cp /tmp/relatorio.txt logs/teste-ponta-a-ponta.txt
          git add logs/teste-ponta-a-ponta.txt
          git commit -m "relatorio: teste de ponta a ponta (execucao ${{ github.run_number }})" || exit 0
          for t in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Falhar se alguma etapa falhou
        if: steps.teste.outcome != 'success' || steps.servidor.outcome != 'success'
        run: exit 1
